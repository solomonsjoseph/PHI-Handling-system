name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q tests

  xls-isolation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pandas-version: ["2.2.3", "3.0.5"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pin matrixed pandas version
        run: pip install "pandas==${{ matrix.pandas-version }}"

      - name: Run XLS-focused suites
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_xls_isolation.py \
            tests/test_xls_dependency_contract.py

  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check backend

      - name: Test
        run: cd backend && pytest tests -q -rs

      - name: Dependency audit (non-blocking)
        run: pipx run pip-audit -r backend/requirements.txt || true

  credentialed:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MONGO_URL: mongodb://localhost:27017
      PHI_ENV: dev
      PHI_TEST_BASE_URL: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Start backend
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        working-directory: backend
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8001 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Test provider integrations
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: cd backend && pytest tests/test_agent_pipeline.py tests/test_experts_web_search.py tests/test_corpus_researcher.py -q -rs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ""
          INLINE_RUNTIME_CHUNK: "false"
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Dependency audit (non-blocking)
        working-directory: frontend
        run: npm audit --audit-level=high || true
