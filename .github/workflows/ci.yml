name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

  xls-isolation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pandas-version: ["2.2.3", "3.0.5"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pin matrixed pandas version
        run: pip install "pandas==${{ matrix.pandas-version }}"

      - name: Run XLS-focused suites
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_xls_isolation.py \
            tests/test_xls_dependency_contract.py
